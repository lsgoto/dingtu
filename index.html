<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#8f3226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>鼎图·山经 · 一等山狩</title>
<style>
:root{
  --paper:#f3e9d4; --paper2:#ece0c5; --ink:#2a2118; --ink2:#5c4c38;
  --red:#8f3226; --red2:#b24a36; --jade:#2f5d62; --gold:#8a6d3b;
  --line:#c3ae8a; --dim:#9a8a70; --green:#2e7d4f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#d9cdb4;color:var(--ink);
  font-family:"楷体","KaiTi","STKaiti","宋体","SimSun",serif;
  font-size:16px;-webkit-font-smoothing:antialiased;
}
#app{width:100vw;height:100vh;display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
header{
  background:var(--red);color:#f6ecd8;padding:10px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex-shrink:0;
}
header h1{font-size:23px;font-weight:400;letter-spacing:.24em}
header .sub{font-size:12.6px;color:#f6ecd8aa;letter-spacing:.12em}
header .spacer{margin-left:auto}
.pill{font-size:13.8px;background:#f6ecd81a;border:1px solid #f6ecd83a;padding:3px 10px;color:#f6ecd8cc}
.pill b{color:#fff;font-weight:400}
.tab{font-family:inherit;font-size:14.4px;background:transparent;border:1px solid #f6ecd855;
     color:#f6ecd8cc;padding:4px 14px;cursor:pointer;letter-spacing:.1em}
.tab.on{background:#f6ecd8;color:var(--red);border-color:#f6ecd8}

#stage{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
#sHub.on,#sForge.on,#sBag.on{display:block;overflow-y:auto;padding:16px 22px}
#sBattle.on{display:grid;grid-template-columns:330px 1fr 340px}
#sBattle.on > *{min-height:0;overflow:hidden}

.col{padding:14px 18px;overflow-y:auto;min-height:0}
.col.left{border-right:1px solid var(--line);background:linear-gradient(180deg,#efe4cd,#f3e9d4)}
.col.right{border-left:1px solid var(--line);background:linear-gradient(180deg,#efe4cd,#f3e9d4)}
.col::-webkit-scrollbar,.log::-webkit-scrollbar,#sHub::-webkit-scrollbar,#sForge::-webkit-scrollbar,#sBag::-webkit-scrollbar{width:7px}
.col::-webkit-scrollbar-thumb,.log::-webkit-scrollbar-thumb,#sHub::-webkit-scrollbar-thumb,#sForge::-webkit-scrollbar-thumb,#sBag::-webkit-scrollbar-thumb{background:#c3ae8a}

h2{font-size:15px;font-weight:400;letter-spacing:.2em;color:var(--gold);
   border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 10px}
h3{font-size:14.4px;font-weight:400;color:var(--ink2);margin:13px 0 6px;letter-spacing:.1em}

.bar{height:11px;background:#e2d4bb;border:1px solid var(--line);margin:5px 0 2px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2));transition:width .3s}
.bar.shield{height:7px}
.bar.shield>i{background:linear-gradient(90deg,#2f5d62,#4b878d)}
.lbl{display:flex;justify-content:space-between;font-size:13.8px;color:var(--ink2)}

.btn{
  font-family:inherit;font-size:15px;color:var(--ink);background:#f7efdd;
  border:1px solid var(--line);padding:7px 14px;cursor:pointer;
  letter-spacing:.08em;transition:.15s;text-align:center;
}
.btn:hover:not(:disabled){background:var(--red);color:#f6ecd8;border-color:var(--red)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{font-size:13.2px;padding:4px 9px}
.btn.red{background:var(--red);color:#f6ecd8;border-color:var(--red)}
.btn.red:hover:not(:disabled){background:#72271d}
.btn.wide{display:block;width:100%}

.card{border:1px solid var(--line);background:#f7efdd;padding:11px 13px}
.card .t{font-size:17.2px;letter-spacing:.06em}
.part{display:flex;align-items:center;gap:9px;padding:7px 9px;font-size:14.4px;
  border-bottom:1px dashed #d3c19f}
.part:last-child{border-bottom:0}
.part.dead{opacity:.38}
.part .nm{width:74px;flex-shrink:0;letter-spacing:.06em}
.part .type{font-size:12px;color:var(--dim);width:38px;flex-shrink:0}
.part .dots{font-size:13.8px;letter-spacing:2px;color:var(--jade);flex-shrink:0;width:100px}
.part .pct{font-size:13.2px;color:var(--gold);width:50px;text-align:right;flex-shrink:0}
.part .skl{font-size:12.6px;color:var(--ink2);margin-left:auto;text-align:right;line-height:1.45}
.part .core{color:var(--red);font-size:11.5px;border:1px solid #8f322655;padding:0 3px;margin-left:3px}
.part.dead .dots{color:#b0a189}

.log{height:100%;overflow-y:auto;font-size:13.8px;line-height:1.85;color:var(--ink2)}
.log p{margin-bottom:2px;border-bottom:1px dotted #ded0b4;padding-bottom:1px}
.log .hit{color:var(--red)}
.log .brk{color:#7a4bb5}
.log .mat{color:var(--jade)}
.log .ok{color:var(--green)}
.log .bad{color:#a33a2a}

.mid{display:flex;flex-direction:column;min-height:0}
.midhead{padding:12px 20px 0;flex-shrink:0}
.beastrow{display:flex;align-items:center;gap:11px}
.beastrow .n{font-size:21.9px;letter-spacing:.16em}
.beastrow .g{font-size:12px;color:var(--jade);border:1px solid #2f5d6255;padding:1px 6px;letter-spacing:.1em}
.beastrow .e{font-size:12px;color:#8f3226;border:1px solid #8f322655;padding:1px 6px;letter-spacing:.1em}
.midbody{flex:1;padding:10px 20px;overflow-y:auto;min-height:0}

.clock{margin:10px 0 12px;border:1px solid var(--line);background:#efe3cb;padding:9px 11px}
.clock .row{display:flex;align-items:center;gap:9px;font-size:13.8px;margin:4px 0}
.clock .row .who{width:66px;color:var(--ink2);flex-shrink:0}
.clock .row .track{flex:1;height:7px;background:#ddd0b4;border:1px solid #cbb896}
.clock .row .track>i{display:block;height:100%}
.clock .row .tm{width:74px;text-align:right;color:var(--dim);font-size:12.6px;flex-shrink:0}

.actions{padding:11px 20px;border-top:1px solid var(--line);background:#efe3cb;flex-shrink:0}
.wslots{display:flex;gap:8px;margin-bottom:8px}
.ws{flex:1;border:1px solid var(--line);background:#f7efdd;padding:5px 9px;cursor:pointer;font-size:13.2px;transition:.13s}
.ws:hover{background:#fff8e8}
.ws.on{border-color:var(--red);background:#fff5e4;box-shadow:inset 0 0 0 1px #8f322644}
.ws.empty{opacity:.4;cursor:default}
.ws .n{display:flex;justify-content:space-between}
.ws .n small{color:var(--dim)}
.skills{display:flex;gap:9px;flex-wrap:wrap}
.actions .btn.red{flex:0 0 120px}
.sk{flex:1;min-width:150px;border:1px solid var(--line);background:#f7efdd;padding:8px 11px;cursor:pointer;transition:.13s}
.sk:hover{background:#fff8e8}
.sk.sel{border-color:var(--red);background:#fff5e4;box-shadow:inset 0 0 0 1px #8f322644}
.sk .a{font-size:15.5px;letter-spacing:.06em;display:flex;justify-content:space-between}
.sk .a small{font-size:12.6px;color:var(--dim);font-weight:400}
.sk .b{font-size:12.6px;color:var(--ink2);margin-top:3px;line-height:1.5}

.overlay{position:absolute;inset:0;background:#2a2118e0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:30}
.sheet{background:var(--paper);border:1px solid var(--line);width:min(920px,100%);max-height:100%;overflow-y:auto;padding:26px 30px}
.sheet h2{border:0;font-size:20.7px;letter-spacing:.2em;color:var(--ink);margin-bottom:14px}
.sheet p{font-size:15px;line-height:1.9;color:var(--ink2);margin-bottom:7px}
.sheet .k{color:var(--red)}
.tag{font-size:12px;padding:1px 6px;border:1px solid currentColor;letter-spacing:.06em;margin-left:4px}
.q-完璧{color:#a8781f}.q-精奇{color:#2f5d62}.q-寻常{color:#6b5a42}.q-残缺{color:#9a3b2a}
.hr{height:1px;background:var(--line);margin:14px 0}
.muted{color:var(--dim);font-size:13.2px;line-height:1.7}
.inv{display:flex;justify-content:space-between;font-size:13.8px;padding:4px 0;border-bottom:1px dotted #d8c8a8}
.inv:last-child{border-bottom:0}
.slot{display:flex;justify-content:space-between;align-items:center;font-size:14.4px;padding:5px 0;border-bottom:1px dotted #d8c8a8}
.rbtn{font-family:inherit;font-size:12.6px;background:transparent;border:1px solid var(--line);color:var(--ink2);padding:2px 8px;cursor:pointer;margin-left:6px}
.rbtn:hover{background:var(--red);color:#f6ecd8;border-color:var(--red)}
.rbtn.on{background:var(--red);color:#f6ecd8;border-color:var(--red)}
.seal-row{display:flex;justify-content:space-between;font-size:13.8px;padding:3px 0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.details{font-size:12.6px;color:var(--dim);line-height:1.65}
.beastgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hublayout{display:flex;gap:18px;align-items:flex-start}
.hubmain{flex:1;min-width:0}
.hubside{width:370px;flex-shrink:0}
.forgelayout{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:13.2px}
.statgrid>div{display:flex;justify-content:space-between;color:#6b5a42;border-bottom:1px dotted #e2d6bd;padding:2px 0}
.statgrid>div:nth-child(odd){padding-right:12px;border-right:1px solid #e2d6bd}
.statgrid>div:nth-child(even){padding-left:12px}
.sect{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.gradehead{font-size:13.8px;color:#8a6d3b;letter-spacing:.2em;margin-bottom:8px}
@media (max-width: 860px){
  header{padding:7px 8px;gap:4px;flex-wrap:wrap;row-gap:4px}
  header h1{font-size:15px;letter-spacing:.04em}
  header .sub{display:none}
  header .spacer{display:none}
  .pill{font-size:10.5px;padding:1px 4px}
  .kp{display:none}
  .tab{font-size:12px;padding:2px 6px}
  header .btn.sm{font-size:11.5px;padding:2px 6px}
  #app,#stage{overflow-x:hidden;max-width:100vw}
  .beastgrid>div,.card{min-width:0;overflow-wrap:anywhere}
  #sHub.on,#sForge.on,#sBag.on{padding:10px 10px}
  #sBattle.on{display:flex;flex-direction:column;overflow-y:auto}
  .col{padding:10px 12px;max-height:none;overflow:visible;flex:0 0 auto}
  .col.left{border-right:0;border-bottom:1px solid var(--line);order:2}
  .mid{display:block;min-height:0;flex:0 0 auto;order:1}
  .midbody{overflow:visible;max-height:none}
  .col.right{border-left:0;border-top:1px solid var(--line);max-height:none;order:3}
  .actions{position:sticky;bottom:0;z-index:6;box-shadow:0 -6px 12px #0000001a}
  .log{height:auto;max-height:44vh}
  .hublayout,.forgelayout{flex-direction:column;align-items:stretch}
  .hubmain,.hubside{width:100%;min-width:0}
  .beastgrid{grid-template-columns:1fr}
  .grid3,.grid2{grid-template-columns:1fr}
  .skills{flex-direction:column}
  .sk{min-width:0;width:100%}
  .wslots{flex-wrap:wrap}
  .ws{min-width:calc(50% - 4px)}
  .btn{font-size:16px;padding:11px 14px}
  .btn.sm{font-size:14px;padding:7px 10px}
  .rbtn{font-size:14px;padding:6px 10px}
  .part{flex-wrap:wrap;gap:6px;padding:8px}
  .part .nm{width:auto}
  .part .skl{margin-left:0;text-align:left;width:100%}
  .actions{padding:10px 12px}
  .midhead{padding:10px 12px 0}
  .midbody{padding:8px 12px}
  .sheet{padding:18px 16px}
}
.midtools{display:none}
.poolrow{font-size:12.6px;color:var(--ink2);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.elemhint{font-size:12.6px;color:#8f3226;margin:6px 0 6px}
.paneclose{display:none}
.forgetabs{display:none}

@media (max-width: 860px){
  #sBattle.on{display:flex;flex-direction:column;height:100%;overflow:hidden;padding:0;position:relative}
  .mid{order:1;flex:1;min-height:0;display:flex;flex-direction:column;border:0}
  .midhead{flex:0 0 auto;padding:8px 12px 6px;background:#efe3cb;border-bottom:1px solid var(--line)}
  .midbody{flex:1;min-height:0;overflow-y:auto;padding:8px 12px 12px}
  .actions{flex:0 0 auto;padding:8px 12px 10px}
  .clock{margin:6px 0 4px;padding:6px 9px}
  .clock .row{margin:2px 0;font-size:12.6px}
  .clock .row .who{width:52px}
  .clock .row .tm{width:58px;font-size:11.5px}
  .poolrow{font-size:12px;margin-top:2px}
  .midtools{display:flex;gap:6px;margin-left:auto}
  .col.left,.col.right{position:absolute;inset:0;z-index:30;background:var(--paper);overflow-y:auto;display:none;padding:14px 14px 20px;border:0}
  .col.left.show,.col.right.show{display:block}
  .paneclose{display:block;position:absolute;top:10px;right:12px;font-size:20px;line-height:1;padding:2px 9px}
  .part{flex-wrap:wrap;gap:4px 8px;padding:8px 9px}
  .part .nm{width:auto}
  .part .type{width:auto}
  .part .dots{width:auto}
  .part .pct{width:auto;margin-left:auto}
  .part .skl{width:100%;margin-left:0;text-align:left;font-size:12.2px}
  .wslots{gap:6px}
  .ws{min-width:0;flex:1}
  .skills{gap:6px;flex-wrap:nowrap}
  .sk{min-width:0;flex:0 0 auto;padding:6px 10px}
  .sk .a small{font-size:11.5px}
  .sk .b{font-size:11.5px;margin-top:2px}
  .sk+.btn.red{flex:0 0 auto;width:100%;height:48px;padding:0;font-size:17px;letter-spacing:.16em;margin-top:2px}
  .actions{max-height:46vh;overflow-y:auto}
  .forgetabs{display:flex;gap:6px;margin-bottom:10px;position:sticky;top:0;z-index:5;background:var(--paper);padding:6px 0}
  .ftab{flex:1;font-family:inherit;font-size:14px;padding:8px 4px;border:1px solid var(--line);background:#efe3cb;color:var(--ink2);cursor:pointer;letter-spacing:.1em}
  .ftab.on{background:#8f3226;color:#f6ecd8;border-color:#8f3226}
  .fsect{display:none}
  .fsect.on{display:block}
  .mebox>summary{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);background:#efe3cb;cursor:pointer;list-style:none;letter-spacing:.04em}
  .mebox>summary::-webkit-details-marker{display:none}
  .mebox>summary b{margin-left:auto;color:#8f3226;font-weight:400;font-size:12.5px}
  .mebox[open]>summary{border-bottom:0}
  .mebox:not([open])>.mebody{display:none}
  .hubside{order:-1;margin-bottom:14px}
  .mebody{padding:10px 11px;border:1px solid var(--line);background:#f7efdd}
}
@media (min-width: 861px){
  .mebox>summary{display:none}
  .mebox>.mebody{display:block}
}
.duo{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.duo .row{display:flex;align-items:center;gap:7px;font-size:12.5px}
.duo .who{width:20px;flex-shrink:0;color:var(--ink2)}
.duo .track{flex:1;height:9px;background:#ddd0b4;border:1px solid #cbb896}
.duo .track>i{display:block;height:100%}
.duo .num{width:74px;text-align:right;color:var(--ink2);font-size:11.5px;flex-shrink:0}
.mats{margin-top:5px}
.matrow{display:flex;align-items:center;gap:6px;font-size:12.8px;line-height:1.7}
.matrow .mq{display:flex;gap:3px;flex-wrap:wrap}
.matrow .mq .tag{font-size:10.5px;padding:0 4px}
.ratebar{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:5px;color:var(--ink2);flex-wrap:wrap}
.ratebar b{color:#8f3226;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>鼎图·山经</h1>
    <span class="sub">卷一 · 一等山狩</span>
    <button class="tab on" id="tabHub" onclick="renderHub()">山 门</button>
    <button class="tab" id="tabBag" onclick="renderBag()">囊</button>
    <button class="tab" id="tabForge" onclick="renderForge()">鼎 工 处</button>
    <span class="spacer"></span>
    <span class="pill">贝 <b id="hudCoins">0</b></span>
    <span class="pill">行速 <b id="hudSpeed">100</b></span>
    <span class="pill kp">击杀 <b id="hudKills">0</b></span>
    <button class="btn sm" id="btnHelp">释 义</button>
    <button class="btn sm" id="btnReset">重 开</button>
  </header>
  <main id="stage">
    <section id="sHub" class="screen"></section>
    <section id="sBag" class="screen"></section>
    <section id="sForge" class="screen"></section>
    <section id="sBattle" class="screen"></section>
  </main>
</div>

<script>
/* ==================== 常量 ==================== */
const GRADES = ['常兽','异兽','怪兽','妖兽','灵兽','神兽','凶兽'];
const QF = {完璧:1.2, 精奇:1.0, 寻常:0.8, 残缺:0.5};
const QFIX = {完璧:2, 精奇:0, 寻常:-1, 残缺:-2};
const QSEAL = {完璧:3, 精奇:2, 寻常:1, 残缺:0};
const QNEXT = {完璧:'精奇', 精奇:'寻常', 寻常:'残缺', 残缺:null};
const QDESC = {完璧:'数值 +2　防具三印', 精奇:'数值 ±0　防具两印',
               寻常:'数值 −1　防具一印', 残缺:'数值 −2　防具无印'};
const SEAL_TIERS = {
  '固守':{need:[3,6,9], desc:['受伤 −8%','受伤 −14%','受伤 −22%'], val:[0.08,0.14,0.22]},
  '疾行':{need:[3,6,9], desc:['行速 +5','行速 +10','行速 +16'], val:[5,10,16]},
  '锐锋':{need:[3,6,9], desc:['神通伤害 +1','+3','+5'], val:[1,3,5]},
  '坚壁':{need:[3,6,9], desc:['体 +8','体 +18','体 +32'], val:[8,18,32]},
  '疾风':{need:[3,6,9], desc:['出手重 −5','−10','−16'], val:[5,10,16]}
};
const KE = {'金':'木','木':'土','土':'水','水':'火','火':'金'};
function elemMul(atk, def){
  if(!atk || !def) return 1;
  if(KE[atk] === def) return 1.3;
  if(KE[def] === atk) return 0.85;
  return 1;
}

/* ==================== 兽 ==================== */
const BEASTS = {
  xuangui:{ id:'xuangui', name:'旋龟', grade:0, hp:80, speed:80, reward:20, elem:'水',
    lore:'怪水出焉，而东流注于宪翼之水。其中多旋龟，其状如龟而鸟首虺尾，其音如判木，佩之不聋。',
    hint:'守。壳厚，会缩。五窍十六点，把十点砸在三处。',
    parts:[
      {id:'head',name:'鸟首',type:'头',max:4,kind:'passive',sk:{name:'磐守',desc:'常驻减伤 20%',reduce:0.2}},
      {id:'shell',name:'龟甲',type:'躯干',max:4,kind:'active',sk:{name:'缩壳',desc:'下次受击减半',weight:100,cd:2,guard:true}},
      {id:'tail',name:'虺尾',type:'外附',max:2,core:true,kind:'active',sk:{name:'尾鞭',desc:'伤害 6',weight:90,cd:1,dmg:6}},
      {id:'fore',name:'前肢',type:'手',max:3,kind:'active',sk:{name:'拨水',desc:'伤害 3',weight:80,cd:1,dmg:3}},
      {id:'hind',name:'后蹼',type:'足',max:3,kind:'active',sk:{name:'沉重',desc:'伤害 2',weight:105,cd:1,dmg:2}}
    ], mats:{head:'鸟喙骨',shell:'龟甲片',tail:'虺尾筋',fore:'前肢骨',hind:'后蹼'} },
  huan:{ id:'huan', name:'讙', grade:0, hp:70, speed:120, reward:22, elem:'金',
    lore:'翼望之山，有兽焉，其状如狸，一目而三尾，名曰讙，其音如夺百声，可以御凶。',

/* ==================== 工具 ==================== */
const $ = id => document.getElementById(id);
const rnd = () => Math.random();
const fmt = x => (Math.round(x*10)/10).toFixed(1);
const recipeOf = id => id ? (RECIPES.find(r=>r.id===id)||null) : null;

function itemOf(uid){ if(!uid) return null; return S.armory.find(a=>a.uid===uid) || null; }
function eq(slot){ return itemOf(S.equip[slot]); }
function eqRecipe(slot){ const it = eq(slot); return it ? recipeOf(it.id) : null; }
function eqQuality(slot){ const it = eq(slot); return (it && it.quality) ? it.quality : '精奇'; }
function qfix(slot){ return QFIX[eqQuality(slot)] || 0; }
function qsel(slot){ return QSEAL[eqQuality(slot)] || 0; }

function sealCounts(){
  const c = {};
  for(const slot of ARMOR_SLOTS){
    const r = eqRecipe(slot);
    if(!r) continue;
    const seals = r.seal ? [r.seal] : (r.seals || []);
    for(const s of seals) c[s] = (c[s]||0) + qsel(slot);
  }
  return c;
}
function sealList(){
  const c = sealCounts();
  return Object.keys(SEAL_TIERS).map(k=>{
    const t = SEAL_TIERS[k], n = c[k]||0;
    let tier = 0;
    for(let i=0;i<3;i++) if(n >= t.need[i]) tier = i+1;
    return {seal:k, n, tier, tiers:t};
  });
}
function sealBonus(seal){
  const s = sealList().find(x=>x.seal===seal);
  if(!s || !s.tier) return 0;
  return SEAL_TIERS[seal].val[s.tier-1];
}
function trinketPas(){
  const r = eqRecipe('trinket');
  return (r && r.pas) ? r.pas : [];
}

function stats(){
  const s = {hp:120, sp:100, red:0, armor:0, shield:0, crit:0, ls:0, air:0, heal:0, first:0};
  for(const tp of trinketPas()){
    const fx = qfix('trinket');
    if(tp.reduce) s.red += tp.reduce + fx*0.01;
    if(tp.hp) s.hp += tp.hp + fx;
    if(tp.speed) s.sp += tp.speed + fx;
    if(tp.crit) s.crit += tp.crit + fx*0.01;
    if(tp.lifesteal) s.ls += tp.lifesteal + fx*0.01;
    if(tp.shield) s.shield += tp.shield + fx;
    if(tp.armor) s.armor += tp.armor;
    if(tp.healOnHit) s.heal += tp.healOnHit + fx;
    if(tp.firstStrike) s.first += tp.firstStrike;
  }
  for(const slot of ARMOR_SLOTS){
    const r = eqRecipe(slot);
    if(!r || !r.armor) continue;
    const fx = qfix(slot), a = r.armor;
    if(a.hp) s.hp += a.hp + fx;
    if(a.speed) s.sp += a.speed;
    if(a.reduce) s.red += a.reduce + fx*0.01;
    if(a.armor) s.armor += a.armor;
    if(a.air) s.air += a.air;
    if(a.shield) s.shield += a.shield;
  }
  s.red += sealBonus('固守');
  s.sp += sealBonus('疾行');
  s.hp += sealBonus('坚壁');
  s.air += sealBonus('疾风');
  if(S.debuff.slowTurns>0) s.sp -= S.debuff.slowAmt;
  s.sp += (S.debuff.speedStack||0);
  s.sp = Math.max(30, Math.round(s.sp));
  s.red = Math.min(0.7, s.red);
  return s;
}
function playerSpeed(){ return stats().sp; }
function playerReduce(){ return stats().red; }
function playerMaxHp(){ return stats().hp; }

/* 武器：三把轮换 */
function curWUid(){ return S.loadout[(B && B.wIdx) || 0]; }
function curWItem(){ return itemOf(curWUid()); }
function weaponSkills(){
  const it = curWItem();
  if(!it) return [];

function weaponSkill(){ const arr = weaponSkills(); const i = (B && B.selSkill) || 0; return arr[i] || arr[0]; }
function weaponElem(){ const it = curWItem(); if(!it) return ''; const r = recipeOf(it.id); return (r && r.elem) || ''; }
function selSkill(i){ if(!B || B.over) return; B.selSkill = i; renderBattle(); }
function switchW(i){
  if(!B || B.over) return;
  if(i === B.wIdx) return;
  if(!S.loadout[i]) return;
  B.wIdx = i; B.selSkill = 0;
  B.tp += 40 / stats().sp;
  const it = itemOf(S.loadout[i]);
  const r = recipeOf(it.id);
  blog('换兵器，横举'+r.name+'，气走了一截。','mat');
  resolveUntilPlayer();
  if(!B.over) renderBattle();
}
function toLoadout(uid){
  const u = Number(uid);
  if(S.loadout.includes(u)){ S.loadout[S.loadout.indexOf(u)] = null; renderBag(); return; }
  const i = S.loadout.indexOf(null);
  if(i < 0){ alert('阵中最多三把。先撤一把。'); return; }
  S.loadout[i] = u;
  renderBag();
}

function matName(key){
  const [b,p] = key.split(':');
  return (BEASTS[b] && BEASTS[b].mats[p]) ? BEASTS[b].mats[p] : key;
}
function addMat(key,q){ if(!S.bag[key]) S.bag[key]=[]; S.bag[key].push(q); }
function countMat(key){ return (S.bag[key]||[]).length; }
function bagList(){
  return Object.keys(S.bag).filter(k=>S.bag[k].length).map(k=>{
    const counts={}; S.bag[k].forEach(q=>counts[q]=(counts[q]||0)+1);
    return {key:k, name:matName(k), counts};
  });
}
function qualityOf(cur, max){
  if(cur <= 0) return null;
  if(cur === max) return '完璧';
  if(cur === 1 || max <= 3) return '残缺';
  if(cur*2 > max) return '精奇';
  return '寻常';
}
function monsterSkillText(sk){
  const bits = ['回气 '+(sk.cd||1)];
  if(sk.weight) bits.push('重 '+sk.weight);
  if(sk.dmg) bits.push('伤 '+sk.dmg);
  if(sk.guard) bits.push('下次受击减半');
  if(sk.guardFull) bits.push('下次受击全免');
  if(sk.reduce) bits.push('减伤 '+Math.round(sk.reduce*100)+'%');
  if(sk.thorns) bits.push('反伤 '+sk.thorns);
  if(sk.steal) bits.push('偷气 '+Math.round(sk.steal*100)+'%');
  if(sk.burn) bits.push('灼烧 '+sk.burn);
  if(sk.slow) bits.push('令你行速 −'+sk.slow.amt);
  if(sk.weightUp) bits.push('令你手沉 +'+sk.weightUp);
  if(sk.miss) bits.push('你 '+Math.round(sk.miss*100)+'% 落空');
  if(sk.scramble) bits.push('你落点被打乱');
  if(sk.scrambleOne) bits.push('你下一击乱落');
  if(sk.selfSpeed) bits.push('自身行速 +'+sk.selfSpeed);
  if(sk.lifestealSelf) bits.push('命中回 '+sk.lifestealSelf);
  if(sk.charge) bits.push('蓄力');
  if(sk.multi) bits.push(sk.multi+' 段');
  return bits.join('　');
}
function fmtSkillFull(sk){
  const f = qfix('weapon') + sealBonus('锐锋');
  const it = curWItem();
  return '伤 '+(sk.dmg+f)+'　重 '+sk.weight+'　'+
    (sk.aim?('偏 '+Object.keys(sk.aim).map(k=>k+'×'+sk.aim[k]).join(' ')):'无偏')+
    (sk.slow?'　迟 '+sk.slow+' 秒':'')+(sk.burn?'　灼烧 '+sk.burn:'')+
    (sk.bleed?'　出血 '+sk.bleed:'')+(sk.extra?'　'+Math.round(sk.extra.chance*100)+'% 再抽 '+sk.extra.dmg:'')+
    (sk.pierce?'　破甲':'')+(sk.multi?'　'+sk.multi+' 段':'')+(sk.charge?'　蓄力':'')+
    (sk.delayEnemy?'　敌迟 '+sk.delayEnemy:'');
}
function skillCost(sk){
  return Math.max(40, sk.weight + (S.debuff.weightUp||0) - stats().air);
}

/* ==================== 战斗 ==================== */
let B = null;
const BASE_SPEED = 100;
function blog(t,c){ if(B) B.log.push({text:t, cls:c||''}); }

function startBattle(id){
  const def = BEASTS[id];
  const st = stats();
  S.hp = Math.min(S.hp, st.hp);
  S.debuff = {slowTurns:0,slowAmt:0,weightUp:0,missTurns:0,scramble:0,speedStack:0};
  B = {
    def, hp:def.hp, maxHp:def.hp, atkSpeed:def.speed,
    parts:def.parts.map(p=>({...p, cur:p.max, sk:{...p.sk}, readyAt:0})),
    pool:0, tp:0, tm:100/def.speed,
    guard:false, guardFull:false, lastAct:null, burnLeft:0, bleedLeft:0, myActs:0,
    pShield: st.shield, wIdx:0, charging:false, firstHit:true,
    over:false, won:false, selSkill:0, log:[]
  };
  blog('入山。遇【'+def.name+'】（'+GRADES[def.grade]+'·'+def.elem+'）。');
  blog('气钟起转：你 '+st.sp+' 行速，它 '+def.speed+' 行速。'+(st.shield?'　息壤护体 '+st.shield+' 点。':''));
  resolveUntilPlayer();
  renderBattle();
}
function poolThreshold(){ return B.maxHp * 0.1; }

function aimMap(){
  const sk = weaponSkill();
  const aim = {};
  if(sk.aim) for(const k in sk.aim) aim[k] = sk.aim[k];
  for(const tp of trinketPas()) if(tp.aim) for(const k in tp.aim) aim[k] = (aim[k]||1)*tp.aim[k];
  return aim;
}
function partWeight(p, aim){
  if(p.cur <= 0) return 0;
  let w = p.core ? 1.3 : (1 + (p.max-1)*0.4);
  if(aim[p.type]) w *= aim[p.type];
  if(aim[p.id])   w *= aim[p.id];
  return Math.max(0.12, w);
}
function weightPcts(){
  const aim = aimMap();
  const ws = B.parts.map(p=>partWeight(p,aim));
  const total = ws.reduce((a,b)=>a+b,0) || 1;
  const out = {};
  B.parts.forEach((p,i)=>{ out[p.id] = ws[i]/total; });
  return out;
}
function rollPart(scramble){
  const alive = B.parts.filter(p=>p.cur>0);
  if(!alive.length) return null;
  if(scramble) return alive[Math.floor(rnd()*alive.length)];
  const aim = aimMap();
  const ws = B.parts.map(p=>partWeight(p,aim));
  const total = ws.reduce((a,b)=>a+b,0);
  let r = rnd()*total;
  for(let i=0;i<ws.length;i++){
    r -= ws[i];
    if(r <= 0 && B.parts[i].cur > 0) return B.parts[i];
  }
  return alive[alive.length-1];
}
function pickBreakTarget(preferId){
  const alive = B.parts.filter(p=>p.cur>0);
  if(!alive.length) return null;
  const pref = alive.find(p=>p.id===preferId);
  if(pref) return pref;
  alive.sort((a,b)=>b.cur-a.cur);
  return alive[0];
}

function playerAttack(){
  if(!B || B.over) return;
  const st = stats();
  const sk = weaponSkill();
  if(!sk){ blog('阵中没有兵器。','bad'); return; }
  const scramble = S.debuff.scramble > 0;
  if(scramble) S.debuff.scramble = 0;
  const cost = skillCost(sk);

  const missP = B.parts.find(p=>p.kind==='passive' && p.cur>0 && p.sk.miss);
  if(missP && rnd() < missP.sk.miss){
    S.atkCount++; B.myActs++;
    blog('你的【'+sk.name+'】落空——【'+missP.name+'】一抬，刀没沾上。','bad');
    B.tp += cost / st.sp;
    resolveUntilPlayer();
    if(!B.over) renderBattle();
    return;
  }

  const part = rollPart(scramble);
  if(!part) return;
  if(scramble) blog('方向乱了，这一击不按你的意思落。','bad');

  S.atkCount++; B.myActs++;
  let dmg = sk.dmg + qfix('weapon') + sealBonus('锐锋');
  if(part.core) dmg -= 2;
  const em = elemMul(weaponElem(), B.def.elem);
  if(em !== 1){ dmg *= em; blog((em>1?'五行相克，':'五行相背，')+'此击 ×'+em.toFixed(2), 'mat'); }
  if(st.first > 0 && B.firstHit){ dmg *= (1+st.first); blog('首击锐利，×'+(1+st.first).toFixed(2),'mat'); }
  let crit = false;
  if(st.crit > 0 && rnd() < st.crit){ crit = true; dmg *= 1.5; }
  if(sk.pierce && (B.guard || B.guardFull)){ B.guard=false; B.guardFull=false; blog('一记破甲，护盾散了。','mat'); }
  if(B.guardFull){ B.guardFull = false; dmg = 0; blog('一层水泡把这一记全吃了。'); }
  else if(B.guard){ dmg *= 0.5; B.guard=false; blog('壳一缩，这一记卸了大半。'); }
  const passive = B.parts.find(p=>p.kind==='passive' && p.cur>0 && p.sk.reduce);
  if(passive) dmg *= (1 - passive.sk.reduce);

  for(const tp of trinketPas()){
    if(tp.every && S.atkCount % tp.every === 0){
      const bn = tp.bonus + qfix('trinket');
      dmg += bn; blog('惑目珠一转，多 '+bn+' 点。','mat');
    }
    if(tp.fireChance && rnd() < tp.fireChance){
      const fd = tp.fireDmg + qfix('trinket');
      dmg += fd; blog('蹈炎珮起火，多烫了 '+fd+' 点。','mat');
    }
    if(tp.speedStack) S.debuff.speedStack = Math.min(tp.speedCap||10, (S.debuff.speedStack||0) + tp.speedStack);
  }
  if(sk.extra && rnd() < sk.extra.chance){ dmg += sk.extra.dmg; blog('三尾抽出三记，多 '+sk.extra.dmg+' 点。','mat'); }
  if(sk.charge){ B.pAtkCharge = true; blog('这一记蓄住了，下一击翻倍。','mat'); }
  if(B.pAtkCharge && !sk.charge){ dmg *= 2; B.pAtkCharge = false; blog('蓄势落下，双倍。','hit'); }

  dmg = Math.max(1, Math.round(dmg));
  const seg = sk.multi || 1;
  B.hp = Math.max(0, B.hp - dmg);
  blog('你【'+sk.name+'】'+(crit?'暴击':'')+(seg>1?'（分 '+seg+' 段）':'')+'，落在【'+part.name+'】：'+dmg+' 点。','hit');
  B.firstHit = false;
  if(st.ls > 0 && dmg > 0){
    const back = Math.round(dmg * st.ls);
    if(back > 0){ S.hp = Math.min(playerMaxHp(), S.hp + back); blog('噬血回 '+back+' 点。','ok'); }
  }
  if(sk.bleed){ B.bleedLeft += sk.bleed; blog('它出血了。','mat'); }

  B.pool += dmg;
  const th = poolThreshold();
  let breaks = 0;
  while(B.pool >= th){
    B.pool -= th;
    const tgt = pickBreakTarget(part.id);
    if(!tgt){ B.pool = 0; break; }
    tgt.cur--; breaks++;
    blog('破窍：【'+tgt.name+'】'+(tgt.cur<=0?'碎裂':('剩 '+tgt.cur+'/'+tgt.max)),'brk');
  }
  if(breaks===0) blog('伤害 '+dmg+'，池 '+fmt(B.pool)+'/'+fmt(th)+'。');

  const thorns = B.parts.find(p=>p.kind==='passive' && p.cur>0 && p.sk.thorns);
  if(thorns){
    S.hp = Math.max(0, S.hp - thorns.sk.thorns);
    blog('反伤，你受 '+thorns.sk.thorns+' 点。','bad');
  }
  if(sk.slow){ B.tm += sk.slow; blog('它被缠住，出手迟了 '+sk.slow+' 秒。','mat'); }
  if(sk.burn){ B.burnLeft += sk.burn; blog('它烧起来了。','mat'); }
  if(sk.delayEnemy){ B.tm += sk.delayEnemy/100; blog('一声威吓，它慢了。','mat'); }
  for(const tp of trinketPas()) if(tp.delayChance && rnd() < tp.delayChance){
    B.tm += tp.delay; blog('婴啼铃一响，它慢了 '+tp.delay+' 秒。','mat');
  }

  if(S.burn>0){ S.hp = Math.max(0, S.hp - S.burnDmg); S.burn--; blog('你身上的火还在烧。','bad'); }
  if(S.debuff.slowTurns>0) S.debuff.slowTurns--;
  S.debuff.weightUp = 0;
  if(st.heal > 0 && S.hp < playerMaxHp()) S.hp = Math.min(playerMaxHp(), S.hp + st.heal);

  if(B.hp<=0){ endBattle(true); return; }
  if(S.hp<=0){ endBattle(false); return; }
  const steal = B.parts.find(p=>p.kind==='passive' && p.cur>0 && p.sk.steal);
  if(steal && rnd() < steal.sk.steal){ B.tp += 0.2; blog('一声夺音，你的气被偷走一截。','bad'); }

  B.tp += cost / st.sp;
  resolveUntilPlayer();
  if(!B.over) renderBattle();
}

function monsterAct(){
  if(B.burnLeft > 0){
    const burn = Math.min(B.burnLeft, 6);
    B.hp = Math.max(0, B.hp - burn); B.burnLeft--;
    blog('余火烧它，'+burn+' 点。','mat');
    if(B.hp<=0){ endBattle(true); return; }
  }
  if(B.bleedLeft > 0){
    B.hp = Math.max(0, B.hp - B.bleedLeft); blog('它在流血，'+B.bleedLeft+' 点。','mat');
    B.bleedLeft--; if(B.hp<=0){ endBattle(true); return; }
  }
  const ready = B.parts.filter(p=>p.kind==='active' && p.cur>0 && (p.readyAt||0) <= B.myActs);
  let alive = ready;
  if(!alive.length){
    alive = B.parts.filter(p=>p.kind==='active' && p.cur>0);
    if(!alive.length){ blog('【'+B.def.name+'】的窍已空，只余喘。'); B.tm += 6; return; }
  }
  let pool = alive.filter(p=>p.id!==B.lastAct);
  if(!pool.length) pool = alive;
  const p = pool[Math.floor(rnd()*pool.length)];
  B.lastAct = p.id;
  p.readyAt = B.myActs + (p.sk.cd || 1);
  const sk = p.sk;

  if(sk.charge){ B.charging = true; blog('【'+p.name+'】压低双角，蓄住了——下一轮要命。','bad'); }
  else if(sk.guardFull){ B.guardFull = true; blog('【'+p.name+'】吐出一层水泡。',''); }
  else if(sk.guard){ B.guard = true; blog('【'+p.name+'】缩壳。',''); }
  if(sk.dmg){
    const st = stats();
    let dmg = sk.dmg;
    if(B.charging){ dmg *= 2; B.charging = false; }
    const tp = trinketPas();
    const dodge = tp.find(x=>x.dodge);
    if(dodge && rnd() < dodge.dodge){ blog('御凶符一挡，这一下没挨上。','ok'); }
    else {
      if(B.pShield > 0){
        const s = Math.min(B.pShield, dmg); B.pShield -= s; dmg -= s;
        blog('息壤护体挡了 '+s+' 点。','ok');
      }
      if(dmg > 0 && st.armor > 0){
        const a = Math.min(st.armor, Math.max(0, Math.floor(dmg*0.5)));
        if(a > 0){ dmg -= a; blog('护甲抵了 '+a+' 点。','ok'); }
      }
      dmg = Math.max(1, Math.round(dmg * (1-st.red)));
      S.hp = Math.max(0, S.hp - dmg);
      blog('【'+p.name+'】'+sk.name+'：你受 '+dmg+' 点'+(st.red>0?'（减伤 '+Math.round(st.red*100)+'%）':'')+'。','bad');
      if(sk.burn){ S.burn = sk.burn; S.burnDmg = 1; blog('你烧起来了。','bad'); }
    }
    // 穷奇嗜血
    const ls = B.parts.find(x=>x.kind==='passive' && x.cur>0 && x.sk.lifestealSelf);
    if(ls && B.hp < B.maxHp){
      B.hp = Math.min(B.maxHp, B.hp + ls.sk.lifestealSelf);
      blog('它吸走一口血，回 '+ls.sk.lifestealSelf+' 点。','bad');
    }
  }
  if(sk.slow){ S.debuff.slowTurns = sk.slow.turns; S.debuff.slowAmt = sk.slow.amt; blog('行速 −'+sk.slow.amt+'（'+sk.slow.turns+' 回合）。','bad'); }
  if(sk.weightUp){ S.debuff.weightUp = sk.weightUp; blog('手头发沉，下次神通重 +'+sk.weightUp+'。','bad'); }
  if(sk.scrambleOne){ S.debuff.scramble = 1; blog('下一击不知道会落到哪。','bad'); }
  if(sk.selfSpeed){ B.atkSpeed += sk.selfSpeed; blog('它越走越快（行速 '+B.atkSpeed+'）。','bad'); }

  B.tm += (sk.weight||100) / B.atkSpeed;
  if(S.hp<=0) endBattle(false);
}
function resolveUntilPlayer(){
  let guard = 0;
  while(!B.over && guard++ < 300){
    if(B.tm < B.tp) monsterAct();
    else return;
  }
}
function endBattle(won){
  B.over = true; B.won = won;
  if(won){ S.kills++; S.coins += B.def.reward; blog('——【'+B.def.name+'】伏地。取山。','ok'); }
  else blog('你倒在山上。山是记不住的。','bad');
  renderResult();
}

/* ==================== 鼎工处 ==================== */
function effectAt(r, q){
  const fix = QFIX[q], sel = QSEAL[q];
  const out = [];
  if(r.sks) out.push(r.sks.map(s=>s.name+' 伤'+(s.dmg+fix)).join(' / '));
  const pas = r.pas || [];
  for(const p of pas){
    if(p.reduce) out.push('减伤 '+Math.round((p.reduce+fix*0.01)*100)+'%');
    if(p.every) out.push('每第'+p.every+'次 +'+(p.bonus+fix));
    if(p.fireChance) out.push(Math.round(p.fireChance*100)+'% 追 '+(p.fireDmg+fix)+' 火');
    if(p.speed) out.push('行速 +'+(p.speed+fix));
    if(p.hp) out.push('体 +'+(p.hp+fix));
    if(p.healOnHit) out.push('受击回 '+(p.healOnHit+fix));
    if(p.delayChance) out.push(Math.round(p.delayChance*100)+'% 迟敌 '+p.delay+' 秒');
    if(p.dodge) out.push('免伤 '+Math.round(p.dodge*100)+'%');
    if(p.speedStack) out.push('出手行速 +'+p.speedStack+'（至 +'+p.speedCap+'）');
    if(p.crit) out.push('暴击 '+Math.round((p.crit+fix*0.01)*100)+'%');
    if(p.lifesteal) out.push('吸血 '+Math.round((p.lifesteal+fix*0.01)*100)+'%');
    if(p.shield) out.push('开局护盾 '+(p.shield+fix));
    if(p.armor) out.push('护甲 '+(p.armor+Math.max(0,fix)));
    if(p.firstStrike) out.push('首击 +'+Math.round(p.firstStrike*100)+'%');
  }
  if(r.armor){
    const a = [];
    if(r.armor.hp) a.push('体 +'+(r.armor.hp+fix));
    if(r.armor.speed) a.push('速 +'+r.armor.speed);
    if(r.armor.reduce) a.push('减伤 '+Math.round((r.armor.reduce+fix*0.01)*100)+'%');
    if(r.armor.armor) a.push('护甲 '+r.armor.armor);
    if(r.armor.air) a.push('气量 −'+r.armor.air);
    out.push(a.join('　'));
  }
  const seals = r.seal ? [r.seal] : (r.seals || []);
  if(seals.length) out.push(seals.map(s=>s+'印 '+sel).join('＋'));
  return out.join('　');
}
const QORD = {完璧:4, 精奇:3, 寻常:2, 残缺:1};
function forgePreview(r){
  let rate = 0.80, used = [], lack = false;
  Object.keys(r.mats).forEach(function(k){
    const arr = (S.bag[k]||[]).slice().sort(function(a,b){return QORD[b]-QORD[a];});
    const take = arr.slice(0, r.mats[k]);
    used = used.concat(take);
    if(arr.length < r.mats[k]) lack = true;
  });
  used.forEach(function(q){ rate += q==='完璧'?0.05 : q==='精奇'?0.02 : q==='残缺'?-0.03 : 0; });
  return {rate: Math.min(0.99, Math.max(0.05, rate)), lack: lack, used: used};
}
function recipeCard(r){
  const pv = forgePreview(r);
  const need = Object.keys(r.mats).map(k=>{
    const have = countMat(k), needN = r.mats[k];
    const arr = (S.bag[k]||[]).slice().sort(function(a,b){return QORD[b]-QORD[a];});
    const take = arr.slice(0, needN);
    const ok = arr.length >= needN;
    const qs = take.length ? take.map(q=>'<span class="tag q-'+q+'">'+q+'</span>').join('') : '<span class="muted" style="font-size:11.5px">无</span>';
    return '<div class="matrow"><span style="color:'+(ok?'#2e7d4f':'#a33a2a')+'">'+matName(k)+'　'+arr.length+' / '+needN+'</span><span class="mq">'+qs+'</span></div>';
  }).join('');
  const enough = Object.keys(r.mats).every(k=>countMat(k)>=r.mats[k]) && S.coins>=r.coins;
  const body = r.sks ? r.sks.map(s=>s.name+'　'+s.desc.replace('｜','，')).join('<br>') : effectAt(r,'精奇');
  const seals = r.seal ? [r.seal] : (r.seals || []);
  return '<div class="card">'+
    '<div class="t" style="font-size:15.5px">'+r.name+
      '<span class="tag" style="color:#9a8a70">'+SLOTNAME[r.slot||r.kind]+'</span>'+
      (r.elem?'<span class="tag" style="color:#8f3226">'+r.elem+'</span>':'')+
      (seals.length?'<span class="tag" style="color:#8a6d3b">'+seals.join('＋')+'</span>':'')+
      (r.grade===1?'<span class="tag" style="color:#8f3226">二等</span>':'')+'</div>'+
    '<div class="details" style="margin-top:5px;color:#5c4c38">'+body+'</div>'+
    '<div class="mats">'+need+'</div>'+
    '<div class="ratebar">预计成器 <b>'+(pv.lack?'—':Math.round(pv.rate*100)+'%')+'</b>'+
      (pv.lack?'<span class="muted">　料不足</span>':'')+
      '<span style="margin-left:auto" class="muted">贝 '+S.coins+' / '+r.coins+'</span></div>'+
    '<button class="btn sm" style="margin-top:7px;width:100%" '+(enough?'':'disabled')+
      ' onclick="doForge(\''+r.id+'\')">开 炉</button>'+
  '</div>';
}
function renderForge(){
  const wpn = RECIPES.filter(r=>r.kind==='weapon' && !r.base).map(recipeCard).join('');
  const trk = RECIPES.filter(r=>r.kind==='trinket').map(recipeCard).join('');
  const arm = RECIPES.filter(r=>r.kind==='armor').map(recipeCard).join('');
  $('sForge').innerHTML =
    '<div style="max-width:1300px;margin:0 auto">'+
      '<div class="forgetabs">'+
        '<button class="ftab on" onclick="forgeTab(0)">武 器</button>'+
        '<button class="ftab" onclick="forgeTab(1)">饰 品</button>'+
        '<button class="ftab" onclick="forgeTab(2)">防 具</button>'+
      '</div>'+
      '<div class="fsect on" id="fs0"><div class="gradehead">武 器</div><div class="grid3">'+wpn+'</div></div>'+
      '<div class="fsect" id="fs1"><div class="sect"><div class="gradehead">饰 品</div><div class="grid3">'+trk+'</div></div></div>'+
      '<div class="fsect" id="fs2"><div class="sect"><div class="gradehead">防 具 · 五 件 五 套</div><div class="grid3">'+arm+'</div></div></div>'+
      '<p class="muted" style="margin-top:12px">成器率底 80%。完璧 +5%，精奇 +2%，残缺 −3%，寻常不增不减。失败则诸材各降一档。<br>'+
      '品质：完璧'+QDESC['完璧']+'　精奇'+QDESC['精奇']+'　寻常'+QDESC['寻常']+'　残缺'+QDESC['残缺']+'</p>'+
    '</div>';
  renderHud();
  showScreen('forge');
  saveGame();
}
function forgeTab(i){
  var tabs = document.querySelectorAll('.ftab');
  for(var k=0;k<tabs.length;k++) tabs[k].classList.toggle('on', k===i);
  for(var j=0;j<3;j++){
    var el = document.getElementById('fs'+j);
    if(el) el.classList.toggle('on', j===i);
  }
}
function doForge(id){
  const r = recipeOf(id);
  if(!r) return;
  const keys = Object.keys(r.mats);
  const picks = {};
  const ord = {完璧:4, 精奇:3, 寻常:2, 残缺:1};
  for(const k of keys){
    const arr = (S.bag[k]||[]).slice();
    if(arr.length < r.mats[k]) return;
    arr.sort((a,b)=>ord[b]-ord[a]);
    picks[k] = arr.slice(0, r.mats[k]);
  }
  if(S.coins < r.coins) return;
  let rate = 0.80;
  const cnt = {完璧:0, 精奇:0, 寻常:0, 残缺:0};
  Object.values(picks).flat().forEach(q=>cnt[q]++);
  rate += cnt.完璧*0.05 + cnt.精奇*0.02 - cnt.残缺*0.03;
  rate = Math.min(0.99, Math.max(0.05, rate));
  if(!confirm('开炉铸【'+r.name+'】？\n成器率 '+Math.round(rate*100)+'%\n贝 '+r.coins)) return;
  for(const k of keys){
    picks[k].forEach(q=>{ const i = S.bag[k].indexOf(q); if(i>=0) S.bag[k].splice(i,1); });
    if(!S.bag[k] || !S.bag[k].length) delete S.bag[k];
  }
  S.coins -= r.coins;
  if(rnd() <= rate){
    const all = Object.values(picks).flat();
    const avg = all.reduce((a,q)=>a+QF[q],0)/all.length;
    const quality = avg>=1.15 ? '完璧' : avg>=0.95 ? '精奇' : avg>=0.75 ? '寻常' : '残缺';
    const it = {uid:uidSeq++, id:r.id, quality};
    S.armory.push(it);
    if(r.base) {}
    else if(r.kind==='weapon'){
      const i = S.loadout.indexOf(null);
      if(i>=0) S.loadout[i] = it.uid;
    } else {
      const slot = r.slot || r.kind;
      if(!S.equip[slot]) S.equip[slot] = it.uid;
    }
    S.hp = Math.min(S.hp, playerMaxHp());
    alert('成器。\n【'+r.name+'】'+quality+'\n'+effectAt(r, quality)+'\n已入器库');
  } else {
    keys.forEach(k=>picks[k].forEach(q=>{ const nq = QNEXT[q]; if(nq) addMat(k, nq); }));
    alert('炉冷。诸材各降一档，退回囊中。');
  }
  renderForge();
}
function equipItem(uid){
  const u = Number(uid);
  const it = itemOf(u);
  if(!it) return;
  const r = recipeOf(it.id);
  S.equip[r.slot || r.kind] = u;
  S.hp = Math.min(S.hp, playerMaxHp());
  renderBag();
}
function unequip(slot){
  S.equip[slot] = null;
  S.hp = Math.min(S.hp, playerMaxHp());
  renderBag();
}

/* ==================== 战斗界面 ==================== */
function togglePane(which){
  var id = which === 'left' ? 'paneLeft' : 'paneRight';
  var el = document.getElementById(id);
  if(!el) return;
  var other = document.getElementById(which === 'left' ? 'paneRight' : 'paneLeft');
  if(other) other.classList.remove('show');
  el.classList.toggle('show');
}

function renderBattle(){
  if(!B) return;
  const st = stats();
  const nowT = Math.min(B.tp, B.tm);
  const nextP = Math.max(0, B.tp - nowT), nextM = Math.max(0, B.tm - nowT);
  const mx = Math.max(nextP, nextM, 0.5);
  const pPct = 100 - Math.min(100, nextP/mx*100), mPct = 100 - Math.min(100, nextM/mx*100);

  const wp = weightPcts();
  const scrambled = S.debuff.scramble > 0;
  const partRows = B.parts.map(p=>{
    const dead = p.cur<=0;
    const dots = '●'.repeat(Math.max(0,p.cur))+'○'.repeat(Math.max(0,p.max-p.cur));
    const skTxt = dead ? '已破，失其技' : (p.sk.name+'　'+monsterSkillText(p.sk));
    const pct = dead ? '—' : (scrambled ? '乱' : Math.round(wp[p.id]*100)+'%');
    return '<div class="part '+(dead?'dead':'')+'">'+
      '<span class="nm">'+p.name+(p.core?'<span class="core">主窍</span>':'')+'</span>'+
      '<span class="type">'+p.type+'</span>'+
      '<span class="dots">'+dots+'</span>'+
      '<span class="pct">'+pct+'</span>'+
      '<span class="skl">'+skTxt+'</span></div>';
  }).join('');

  const sk = weaponSkill();
  const sks = weaponSkills();
  const logHtml = B.log.map(l=>'<p class="'+(l.cls||'')+'">'+l.text+'</p>').join('');
  const bl = buffLine();
  const em = elemMul(weaponElem(), B.def.elem);

  const wslots = S.loadout.map(function(u,i){
    const it = itemOf(u);
    if(!it) return '<div class="ws empty"><div class="n"><span>空位</span></div></div>';
    const r = recipeOf(it.id);
    return '<div class="ws '+(i===B.wIdx?'on':'')+'" onclick="switchW('+i+')">'+
      '<div class="n"><span>'+r.name+'</span><small>'+r.elem+'</small></div>'+
      '<div style="font-size:11.5px;color:#7a6a52">'+(r.sks[0].name)+'</div></div>';
  }).join('');

  $('sBattle').innerHTML =
  '<div class="col left" id="paneLeft">'+
    '<button class="rbtn paneclose" onclick="togglePane(\'left\')">×</button>'+
    '<h2>你</h2>'+
    '<div class="lbl"><span>体</span><span>'+Math.round(S.hp)+' / '+st.hp+'</span></div>'+
    '<div class="bar"><i style="width:'+(Math.max(0,S.hp)/st.hp*100)+'%"></i></div>'+
    (B.pShield>0?'<div class="lbl" style="margin-top:3px"><span>护盾</span><span>'+B.pShield+'</span></div><div class="bar shield"><i style="width:'+Math.min(100,B.pShield/25*100)+'%"></i></div>':'')+
    '<h3>数</h3>'+statBlock()+
    (bl?'<p style="color:#a33a2a;font-size:13.2px;margin-top:6px">'+bl+'</p>':'')+
    '<h3>契印</h3>'+sealBlock()+
  '</div>'+
  '<div class="mid">'+
    '<div class="midhead">'+
      '<div class="beastrow"><span class="n">'+B.def.name+'</span>'+
      '<span class="g">'+GRADES[B.def.grade]+'</span>'+
      '<span class="e">'+B.def.elem+'</span>'+
      '<span class="muted" style="margin-left:auto">行速 '+B.atkSpeed+'</span></div>'+
      '<div class="duo">'+
        '<div class="row"><span class="who">它</span><span class="track"><i style="width:'+(B.hp/B.maxHp*100)+'%;background:#2f5d62"></i></span><span class="num">'+B.hp+' / '+B.maxHp+'</span></div>'+
        '<div class="row"><span class="who">我</span><span class="track"><i style="width:'+(Math.max(0,S.hp)/st.hp*100)+'%;background:#8f3226"></i></span><span class="num">'+Math.round(S.hp)+' / '+st.hp+'</span></div>'+
      '</div>'+
      '<div class="poolrow"><span>破窍池 '+fmt(B.pool)+' / '+fmt(poolThreshold())+
        (B.guardFull?'　<b style="color:#2f5d62">水泡护体</b>':(B.guard?'　<b style="color:#2f5d62">壳已竖起</b>':''))+
        (B.charging?'　<b style="color:#8f3226">它在蓄力</b>':'')+
        '</span><span class="midtools">'+
        '<button class="rbtn" onclick="togglePane(\'left\')">我</button>'+
        '<button class="rbtn" onclick="togglePane(\'right\')">记</button>'+
        '</span></div>'+
    '</div>'+
    '<div class="midbody">'+
      '<p class="elemhint">五行：'+(weaponElem()?
        (em>1?'你的'+weaponElem()+'克它的'+B.def.elem+'（×1.3）':(em<1?'你的'+weaponElem()+'被它的'+B.def.elem+'克（×0.85）':'不相克（×1）'))
        :'你无属性（×1）')+'</p>'+
      partRows+
    '</div>'+
    '<div class="actions">'+
      '<div class="wslots">'+wslots+'</div>'+
      '<div class="skills">'+
        sks.map(function(x,i){
          return '<div class="sk '+(i===(B.selSkill||0)?'sel':'')+'" onclick="selSkill('+i+')">'+
            '<div class="a"><span>'+x.name+'</span><small>重 '+x.weight+' → '+skillCost(x)+'</small></div>'+
            '<div class="b">'+fmtSkillFull(x)+'</div></div>';
        }).join('')+
        '<button class="btn red" onclick="playerAttack()">出 手</button>'+
      '</div>'+
    '</div>'+
  '</div>'+
  '<div class="col right" id="paneRight">'+
    '<button class="rbtn paneclose" onclick="togglePane(\'right\')">×</button>'+
    '<h2>山 记</h2>'+
    '<div class="log" id="logBox">'+logHtml+'</div>'+
  '</div>';
  const lb = $('logBox');
  if(lb) lb.scrollTop = lb.scrollHeight;
  renderHud();
  showScreen('battle');
}

/* ==================== 结算 ==================== */
let lastMats = [];
function renderResult(){
  const mats = [];
  B.parts.forEach(p=>{
    const q = qualityOf(p.cur, p.max);
    if(q) mats.push({key:B.def.id+':'+p.id, matName:B.def.mats[p.id], part:p.name, q, core:p.core});
  });
  lastMats = mats;
  const matHtml = mats.length
    ? mats.map(m=>'<div class="inv"><span>'+m.matName+'（'+m.part+(m.core?' · 主窍':'')+'）</span>'+
        '<span class="q-'+m.q+'">'+m.q+'</span></div>').join('')
    : '<p class="muted">这一趟什么也没带回来。</p>';
  const broke = B.parts.filter(p=>p.cur<=0).map(p=>p.name).join('、') || '无';

  $('sBattle').innerHTML =
  '<div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;padding:24px">'+
    '<div class="sheet" style="width:min(620px,100%);max-height:620px">'+
      '<h2 style="border:0;font-size:20.7px;color:'+(B.won?'#2e7d4f':'#a33a2a')+'">'+(B.won?'取 山':'败 退')+'</h2>'+
      '<p>'+(B.won?'【'+B.def.name+'】伏地。破掉的窍散了图，剩下的图归你。':'你倒在山上。回鼎边歇一宿再来。')+'</p>'+
      '<div class="hr"></div>'+
      '<p class="muted">破去的窍：'+broke+'</p>'+
      (B.won?'<p class="muted" style="margin:8px 0">所得灵材</p>'+matHtml:'')+
      (B.won?'<p class="muted" style="margin-top:8px">贝 +'+B.def.reward+'</p>':'')+
      '<div class="hr"></div>'+
      '<button class="btn wide" onclick="'+(B.won?'takeAndForge()':'backHub()')+'">'+(B.won?'收 材 · 回 鼎':'回 鼎')+'</button>'+
    '</div>'+
  '</div>';
  showScreen('battle');
  renderHud();
}
function takeAndForge(){ lastMats.forEach(m=>addMat(m.key,m.q)); B=null; renderForge(); }
function backHub(){ B=null; S.hp=Math.min(S.hp, playerMaxHp()); renderHub(); }

/* ==================== 释义 ==================== */

  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML =
  '<div class="sheet">'+
    '<h2>释 义</h2>'+
    '<p><span class="k">三把兵器</span>　一场仗最多带三把，战斗中可以换。换一次付 40 重的气量，换完那一击才算数。带三把的理由是覆盖五行、覆盖倾向、覆盖轻重。</p>'+
    '<p><span class="k">气钟</span>　没有回合，只有一条共用的钟。出手后等 重 ÷ 行速 秒。</p>'+
    '<p><span class="k">落点</span>　不能挑打哪里。按权重掷窍：窍越大越容易碰上，主窍固定偏低，武器的部位倾向再把权重拨过去。</p>'+
    '<p><span class="k">破窍</span>　伤害进池，每满对方 10% 生命破一窍，落在这一击碰上的窍。打死一只正好破十点。</p>'+
    '<p><span class="k">五行</span>　金克木、木克土、土克水、水克火、火克金。克制 ×1.3，被克 ×0.85。</p>'+
    '<p><span class="k">契印</span>　五件防具，每件按其品质给印。同系凑 3 / 6 / 9 印发三档，取最高档。二等防具一件带两系印。</p>'+
    '<p><span class="k">品质</span>　完璧'+QDESC['完璧']+'；精奇'+QDESC['精奇']+'；寻常'+QDESC['寻常']+'；残缺'+QDESC['残缺']+'。</p>'+
    '<p><span class="k">等第</span>　一常兽（九头）、二异兽（三头）。异兽六窍二十点，主窍三格。</p>'+
    '<div class="hr"></div>'+
    '<button class="btn wide" onclick="this.closest(\'.overlay\').remove()">合 上</button>'+
  '</div>';
  $('app').appendChild(ov);
}

$('btnHelp').onclick = showHelp;
$('btnReset').onclick = function(){
  if(confirm('从头开始？存档也会清掉。')){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} uidSeq = 1; S = newPlayer(); giveStarter(); renderHub(); }
};
if(loadGame()) renderHub(); else renderHub();
